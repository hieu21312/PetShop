<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container mt-4">
    <div th:replace="${content}"></div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<style>
    #chatbot-widget {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 99999;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .chatbot-trigger-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--gradient-pink);
        color: white;
        border: none;
        outline: none;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
    }
    
    .chatbot-trigger-btn:hover {
        transform: scale(1.1) rotate(-5deg);
        box-shadow: 0 12px 30px rgba(245, 87, 108, 0.5);
    }
    
    .chatbot-trigger-btn .notify-dot {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 14px;
        height: 14px;
        background-color: #2ecc71;
        border: 2px solid white;
        border-radius: 50%;
        animation: pulseTrigger 1.5s infinite;
    }
    
    @keyframes pulseTrigger {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0.8; }
    }
    
    .chatbot-mini-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 360px;
        height: 500px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        border: 1px solid #f0f0f0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        transform: translateY(30px) scale(0.9);
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .chatbot-mini-window.show {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }
    
    .mini-chat-header {
        background: var(--gradient-pink);
        color: white;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    
    .mini-chat-header-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .mini-chat-header-info img {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: 1.5px solid white;
        object-fit: cover;
    }
    
    .mini-chat-header-info h6 {
        margin: 0;
        font-weight: 700;
        font-size: 0.95rem;
    }
    
    .mini-chat-header-info span {
        font-size: 0.75rem;
        opacity: 0.9;
        display: flex;
        align-items: center;
        gap: 4px;
    }
    
    .mini-chat-header .close-btn {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
        opacity: 0.8;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .mini-chat-header .close-btn:hover {
        opacity: 1;
        transform: scale(1.1);
    }
    
    .mini-chat-messages {
        flex: 1;
        padding: 1rem;
        overflow-y: auto;
        background-color: #fcfcfc;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .mini-chat-bubble {
        max-width: 80%;
        padding: 0.7rem 1rem;
        border-radius: 16px;
        font-size: 0.88rem;
        line-height: 1.4;
        word-wrap: break-word;
        animation: bubbleSlideUp 0.3s ease;
    }
    
    @keyframes bubbleSlideUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .mini-chat-bubble.bot {
        background-color: #f1f2f6;
        color: var(--dark);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }
    
    .mini-chat-bubble.user {
        background: var(--gradient);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }
    
    .mini-chat-quick-replies {
        padding: 0.6rem 1rem;
        background: #f8f9fa;
        border-top: 1px solid #eee;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }
    
    .mini-quick-reply-btn {
        background: white;
        border: 1px solid var(--primary);
        color: var(--primary) !important;
        padding: 0.3rem 0.7rem;
        border-radius: 20px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
    }
    
    .mini-quick-reply-btn:hover {
        background: var(--primary);
        color: white !important;
        transform: translateY(-1px);
    }
    
    .mini-chat-input-area {
        padding: 0.8rem;
        background: white;
        border-top: 1px solid #eee;
        display: flex;
        gap: 8px;
        align-items: center;
    }
    
    .mini-chat-input-area input {
        flex: 1;
        border: 1.5px solid #e9ecef;
        padding: 0.6rem 1rem;
        border-radius: 25px;
        outline: none;
        font-size: 0.88rem;
        transition: var(--transition);
    }
    
    .mini-chat-input-area input:focus {
        border-color: var(--primary);
    }
    
    .mini-chat-send-btn {
        background: var(--gradient-pink);
        color: white;
        border: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.9rem;
        transition: var(--transition);
    }
    
    .mini-chat-send-btn:hover {
        transform: scale(1.05);
    }
    
    .mini-typing-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0.4rem 0.8rem;
    }
    
    .mini-typing-indicator span {
        width: 6px;
        height: 6px;
        background-color: #a4b0be;
        border-radius: 50%;
        animation: miniTyping 1.4s infinite;
    }
    
    .mini-typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .mini-typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes miniTyping {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
    }
</style>

<div id="chatbot-widget">
    <!-- Trigger Button -->
    <button class="chatbot-trigger-btn" onclick="toggleMiniChatWindow()" id="chatTriggerBtn">
        <i class="fas fa-comments"></i>
        <span class="notify-dot"></span>
    </button>

    <!-- Chat Window -->
    <div class="chatbot-mini-window" id="chatMiniWindow">
        <!-- Header -->
        <div class="mini-chat-header">
            <div class="mini-chat-header-info">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=150&auto=format&fit=crop" alt="Bot Avatar">
                <div>
                    <h6>Trợ Lý Ảo PetShop</h6>
                    <span><i class="fas fa-circle text-success" style="font-size: 0.5rem;"></i> Trực tuyến</span>
                </div>
            </div>
            <button class="close-btn" onclick="toggleMiniChatWindow()"><i class="fas fa-times"></i></button>
        </div>

        <!-- Messages Area -->
        <div class="mini-chat-messages" id="miniChatMessages">
            <div class="mini-chat-bubble bot">
                Xin chào! Mình là trợ lý ảo PetShop 🐶🐱. Bạn có thắc mắc gì về sản phẩm, dịch vụ Spa hay địa chỉ shop không ạ? Nhập tin nhắn hoặc chọn nhanh gợi ý nhé!
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="mini-chat-quick-replies">
            <button class="mini-quick-reply-btn" onclick="sendMiniQuickReply('Địa chỉ cửa hàng?')">Địa chỉ</button>
            <button class="mini-quick-reply-btn" onclick="sendMiniQuickReply('Giá dịch vụ tắm, cắt tỉa?')">Giá dịch vụ</button>
            <button class="mini-quick-reply-btn" onclick="sendMiniQuickReply('Có ưu đãi gì không?')">Khuyến mãi</button>
            <button class="mini-quick-reply-btn" onclick="sendMiniQuickReply('Shop ở đây mấy giờ?')">Giờ mở cửa</button>
        </div>

        <!-- Input Area -->
        <div class="mini-chat-input-area">
            <input type="text" id="miniChatInput" placeholder="Nhập câu hỏi..." onkeypress="handleMiniKeyPress(event)">
            <button class="mini-chat-send-btn" onclick="sendMiniMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    function toggleMiniChatWindow() {
        var win = document.getElementById('chatMiniWindow');
        var dot = document.querySelector('.notify-dot');
        win.classList.toggle('show');
        if (win.classList.contains('show')) {
            if (dot) dot.style.display = 'none'; // hide green dot when chat opened
            setTimeout(() => {
                document.getElementById('miniChatInput').focus();
            }, 300);
        }
    }

    function handleMiniKeyPress(e) {
        if (e.key === 'Enter') {
            sendMiniMessage();
        }
    }

    function sendMiniQuickReply(text) {
        addMiniUserMessage(text);
        getMiniBotReply(text);
    }

    function sendMiniMessage() {
        var input = document.getElementById('miniChatInput');
        var text = input.value.trim();
        if (text === '') return;
        
        addMiniUserMessage(text);
        input.value = '';
        getMiniBotReply(text);
    }

    function addMiniUserMessage(text) {
        var container = document.getElementById('miniChatMessages');
        var bubble = document.createElement('div');
        bubble.className = 'mini-chat-bubble user';
        bubble.innerText = text;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
    }

    function addMiniBotMessage(text) {
        var container = document.getElementById('miniChatMessages');
        var bubble = document.createElement('div');
        bubble.className = 'mini-chat-bubble bot';
        bubble.innerHTML = text;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
    }

    function showMiniTypingIndicator() {
        removeMiniTypingIndicator();
        var container = document.getElementById('miniChatMessages');
        var div = document.createElement('div');
        div.id = 'miniTypingIndicator';
        div.className = 'align-self-start';
        div.innerHTML = `
            <div class="mini-chat-bubble bot py-2 px-3 d-flex align-items-center" style="border-bottom-left-radius: 4px;">
                <div class="mini-typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeMiniTypingIndicator() {
        var ind = document.getElementById('miniTypingIndicator');
        if (ind) ind.remove();
    }

    function removeMiniDiacritics(str) {
        if (!str) return '';
        return str.toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .replace(/[^a-z0-9 ]/g, '');
    }

    function getMiniBotReply(userText) {
        showMiniTypingIndicator();
        
        setTimeout(function() {
            removeMiniTypingIndicator();
            var text = removeMiniDiacritics(userText);
            var reply = "";

            if (text.includes("chao") || text.includes("alo") || text.includes("hi") || text.includes("hello")) {
                reply = "Xin chào! Trợ lý ảo PetShop rất vui được hỗ trợ bạn và các bé cưng. Hôm nay bên mình có nhiều chương trình Spa và ưu đãi phụ kiện lắm đó ạ!";
            } 
            else if (text.includes("dia chi") || text.includes("o dau") || text.includes("cua hang") || text.includes("chi nhanh")) {
                reply = "PetShop ở địa chỉ duy nhất tại: <strong>140 Lê Trọng Tấn, Tây Thạnh, Tân Phú, TP.HCM</strong>. Shop rất dễ tìm, có chỗ đậu xe máy và ô tô rộng rãi nha bạn!";
            } 
            else if (text.includes("spa") || text.includes("tam") || text.includes("cat tia") || text.includes("lam dep") || text.includes("ve sinh")) {
                reply = "Bên mình có các gói dịch vụ <strong>Tắm vệ sinh & Cắt tỉa tạo kiểu</strong> chuyên nghiệp cho cún cưng và mèo cưng. Đảm bảo các bé sẽ lột xác thơm tho và xinh xắn tuyệt đối!";
            } 
            else if (text.includes("gia") || text.includes("bao nhieu") || text.includes("nhieu tien") || text.includes("chi phi")) {
                reply = "Chi phí dịch vụ cụ thể:<br>• Tắm vệ sinh: từ 100k - 250k.<br>• Combo Cắt tỉa: từ 250k - 450k.<br>• Khách sạn lưu trú: chỉ từ 150k/ngày.<br>Phụ kiện và đồ ăn đang giảm giá sập sàn!";
            } 
            else if (text.includes("khuyen mai") || text.includes("giam gia") || text.includes("uu dai")) {
                reply = "🎁 <strong>Đừng bỏ lỡ ưu đãi:</strong><br>• Giảm 10% dịch vụ Spa cho khách hàng trải nghiệm lần đầu.<br>• Free Ship TP.HCM cho đơn phụ kiện từ 300k.<br>Bạn có muốn mua sản phẩm gì hôm nay không?";
            } 
            else if (text.includes("sdt") || text.includes("dien thoai") || text.includes("hotline") || text.includes("lien he") || text.includes("email")) {
                reply = "Bạn liên hệ trực tiếp PetShop nhé:<br>📞 Hotline: <strong>1800 4635</strong> (miễn cước)<br>✉ Email: <strong>contact@petshop.vn</strong>";
            } 
            else if (text.includes("thuc an") || text.includes("hat") || text.includes("pate") || text.includes("sua")) {
                reply = "Shop có sẵn thức ăn hạt Royal Canin, Whiskas, Catsrang, pate ướt cao cấp cho chó mèo. Đều là hàng chính hãng đầy đủ tem mác, hạn sử dụng cực dài!";
            } 
            else if (text.includes("gio") || text.includes("may gio") || text.includes("mo cua") || text.includes("dong cua")) {
                reply = "Thời gian làm việc của PetShop:<br>• Thứ 2 - Thứ 6: 09:00 - 20:00<br>• Thứ 7: 11:00 - 15:00<br>• Chủ nhật: Nghỉ ngơi dưỡng sức.<br>Rất hân hạnh được đón tiếp bạn!";
            }
            else if (text.includes("cho") || text.includes("cun") || text.includes("puppy")) {
                reply = "Shop bán cực nhiều phụ kiện cho cún yêu: Quần áo, vòng cổ, dây dắt, chuồng nệm gỗ, đồ chơi bóng gặm và cả thức ăn dinh dưỡng nữa nha!";
            } 
            else if (text.includes("meo") || text.includes("miu") || text.includes("kitten")) {
                reply = "Cho boss mèo, shop có nhà cây cào móng, cát vệ sinh khử mùi, cần câu lông gà, pate hạt dinh dưỡng và cả súp thưởng nữa nhé!";
            } 
            else if (text.includes("dat lich") || text.includes("dat cho") || text.includes("book")) {
                reply = "Bạn vui lòng kết nối trực tiếp Hotline <strong>1800 4635</strong> hoặc ghé mục <strong>Liên Hệ</strong> trên thanh menu để gửi lại thông tin tư vấn nhé!";
            } 
            else {
                reply = "Cảm ơn câu hỏi của bạn. Mình là trợ lý ảo nên hiểu biết còn giới hạn một chút. Bạn cần hỗ trợ nhanh vui lòng gọi Hotline <strong>1800 4635</strong> hoặc ghé trực tiếp shop nha! 🐶🐱";
            }

            addMiniBotMessage(reply);
        }, 700);
    }
</script>
<script>
    const myCarousel = document.querySelector('#petBanner');

    if(myCarousel){
        new bootstrap.Carousel(myCarousel, {
            interval: 2500,
            ride: 'carousel',
            wrap: true,
            pause: false
        });
    }
</script>
</body>
</html>
