<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3"><div th:replace="~{admin/admin-sidebar :: sidebar}"></div></div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold text-gradient"><i class="fas fa-shopping-bag"></i> Quản lý đơn hàng</h2><span class="badge bg-danger fs-6 px-3 py-2">Tổng: <span th:text="${#lists.size(orders)}"></span> đơn</span></div>
                <div class="card border-0 shadow-sm"><div class="card-body p-0"><table class="table table-hover mb-0"><thead class="table-pink"><tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày lập</th><th>Tổng tiền</th><th>Tình trạng</th><th>Thao tác</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${order.maHD}">...</td><td th:text="${order.customer != null ? order.customer.tenKH : 'Khách lẻ'}">...</td><td th:text="${#temporals.format(order.ngayLap, 'dd/MM/yyyy HH:mm')}">...</td><td th:text="${#numbers.formatDecimal(order.tongTien, 0, 0, 'COMMA')} + ' đ'">...</td><td th:text="${order.orderStatus != null ? order.orderStatus.tinhTrangDonHang : 'Đang xử lý'}">...</td><td><a th:href="@{/admin/orders/detail/{id}(id=${order.maHD})}" class="btn btn-sm btn-primary">Cập nhật</a></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6" class="text-center">Chưa có đơn hàng nào</td></tr></tbody></table></div></div>
            </div>
        </div>
    </section>
</div>
