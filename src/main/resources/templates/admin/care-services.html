<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-gradient mb-1">
                            <i class="fas fa-spa text-success me-2"></i> Quản lý dịch vụ chăm sóc
                        </h2>
                        <p class="text-muted small mb-0">Quản lý các gói Spa, Grooming cắt tỉa lông, Khách sạn lưu chuồng và dịch vụ Thú y</p>
                    </div>
                    <a th:href="@{/admin/care-services/create}" class="btn btn-success px-4 rounded-pill shadow-sm">
                        <i class="fas fa-plus me-1"></i> Thêm mới
                    </a>
                </div>

                <!-- Bộ lọc theo nhóm dịch vụ -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-3">
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/admin/care-services}" class="btn btn-sm rounded-pill px-3" 
                               th:classappend="${currentNhom == null or currentNhom == 'All' ? 'btn-dark' : 'btn-outline-secondary'}">
                                Tất cả dịch vụ
                            </a>
                            <a th:href="@{/admin/care-services?nhom=Spa - Grooming}" class="btn btn-sm rounded-pill px-3" 
                               th:classappend="${currentNhom == 'Spa - Grooming' ? 'btn-danger' : 'btn-outline-danger'}">
                                <i class="fas fa-cut me-1"></i> Spa & Grooming
                            </a>
                            <a th:href="@{/admin/care-services?nhom=Khách sạn thú cưng}" class="btn btn-sm rounded-pill px-3" 
                               th:classappend="${currentNhom == 'Khách sạn thú cưng' ? 'btn-warning text-dark' : 'btn-outline-warning text-dark'}">
                                <i class="fas fa-hotel me-1"></i> Khách sạn thú cưng
                            </a>
                            <a th:href="@{/admin/care-services?nhom=Thú y & Khám chữa}" class="btn btn-sm rounded-pill px-3" 
                               th:classappend="${currentNhom == 'Thú y & Khám chữa' ? 'btn-primary' : 'btn-outline-primary'}">
                                <i class="fas fa-stethoscope me-1"></i> Thú y & Khám chữa
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Bảng danh sách dịch vụ -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" style="min-width: 850px;">
                                <thead class="table-pink text-nowrap">
                                    <tr>
                                        <th style="min-width: 60px;">Mã</th>
                                        <th style="min-width: 220px;">Tên dịch vụ chăm sóc</th>
                                        <th style="min-width: 160px;">Nhóm dịch vụ</th>
                                        <th style="min-width: 140px;">Đối tượng</th>
                                        <th style="min-width: 120px;">Thời gian</th>
                                        <th style="min-width: 130px;">Giá dịch vụ</th>
                                        <th class="text-center" style="min-width: 120px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="s : ${services}">
                                        <td class="text-nowrap"><span class="fw-bold text-muted" th:text="'#' + ${s.maDVCS}"></span></td>
                                        <td class="text-nowrap">
                                            <div class="fw-bold text-dark" th:text="${s.tenDichVu}"></div>
                                            <small class="text-muted text-truncate d-block" style="max-width: 250px;" th:title="${s.moTaChiTiet}" th:text="${s.moTaChiTiet}"></small>
                                        </td>
                                        <td class="text-nowrap">
                                            <span class="badge px-3 py-2" 
                                                  th:classappend="${s.nhomDichVu == 'Spa - Grooming' ? 'bg-danger-subtle text-danger border border-danger-subtle' : (s.nhomDichVu == 'Khách sạn thú cưng' ? 'bg-warning-subtle text-warning-emphasis border' : 'bg-primary-subtle text-primary border')}"
                                                  th:text="${s.nhomDichVu}"></span>
                                        </td>
                                        <td class="text-nowrap">
                                            <span class="text-secondary fw-semibold small" th:text="${s.doiTuongApDung ?: 'Tất cả'}"></span>
                                        </td>
                                        <td class="text-nowrap">
                                            <span class="badge bg-light text-dark border px-2 py-1" th:if="${s.thoiGianThucHien != null}" th:text="${s.thoiGianThucHien} + ' phút'"></span>
                                        </td>
                                        <td class="text-nowrap">
                                            <span class="text-danger fw-bold fs-6" th:text="${#numbers.formatDecimal(s.giaDichVu, 0, 0, 'COMMA')} + ' đ'"></span>
                                        </td>
                                        <td class="text-center text-nowrap">
                                            <a th:href="@{/admin/care-services/edit/{id}(id=${s.maDVCS})}" class="btn btn-sm btn-outline-warning rounded-pill px-2 me-1" title="Chỉnh sửa">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/care-services/delete/{id}(id=${s.maDVCS})}" class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="return confirm('Bạn có chắc muốn xóa dịch vụ chăm sóc này?')" title="Xóa">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(services)}">
                                        <td colspan="7" class="text-center py-5 text-muted">
                                            <i class="fas fa-spa fs-1 d-block mb-3 text-secondary"></i>
                                            Chưa có dịch vụ chăm sóc nào.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</div>
