<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <h2 class="fw-bold text-gradient mb-4"><i class="fas fa-boxes"></i> Quản lý tồn kho (Phụ kiện)</h2>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-pink">
                            <tr>
                                <th>Mã SP</th>
                                <th>Tên sản phẩm</th>
                                <th>Số lượng tồn</th>
                                <th width="200">Cập nhật</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${products}">
                                <td th:text="${p.maSP}"></td>
                                <td th:text="${p.tenSP}"></td>
                                <form th:action="@{/admin/inventory/update}" method="post" class="d-inline">
                                    <input type="hidden" name="maSP" th:value="${p.maSP}">
                                    <td>
                                        <input type="number" name="soLuongTon" class="form-control form-control-sm" style="width: 100px;" th:value="${p.inventory.soLuongTon}" required>
                                    </td>
                                    <td>
                                        <button type="submit" class="btn btn-sm btn-primary">Cập nhật</button>
                                    </td>
                                </form>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="4" class="text-center py-4">Không có sản phẩm phụ kiện nào</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
