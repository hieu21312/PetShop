<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-gradient mb-1">
                            <i class="fas fa-id-card text-primary me-2"></i> Quản lý hồ sơ chủ nuôi
                        </h2>
                        <p class="text-muted small mb-0">Quản lý danh bạ, địa chỉ, thông tin khẩn cấp và đàn thú cưng của khách hàng</p>
                    </div>
                    <a th:href="@{/admin/owners/create}" class="btn btn-success px-4 rounded-pill shadow-sm">
                        <i class="fas fa-plus me-1"></i> Thêm mới
                    </a>
                </div>

                <!-- Tìm kiếm -->
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-3">
                        <form th:action="@{/admin/owners}" method="get" class="row g-2">
                            <div class="col-md-10">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                    <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0" placeholder="Tìm theo họ tên chủ nuôi, số điện thoại...">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-dark w-100 rounded-3">Tìm kiếm</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Bảng danh sách chủ nuôi -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" style="min-width: 900px;">
                                <thead class="table-pink text-nowrap">
                                    <tr>
                                        <th style="min-width: 60px;">Mã</th>
                                        <th style="min-width: 200px;">Chủ nuôi</th>
                                        <th style="min-width: 170px;">Liên hệ</th>
                                        <th style="min-width: 200px;">Địa chỉ</th>
                                        <th style="min-width: 130px;">Hạng / Điểm</th>
                                        <th class="text-center" style="min-width: 180px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="o : ${owners}">
                                        <td class="text-nowrap"><span class="fw-bold text-primary" th:text="'#' + ${o.maChuNuoi}"></span></td>
                                        <td class="text-nowrap">
                                            <div class="fw-bold text-dark" th:text="${o.hoTenChuNuoi}"></div>
                                            <small class="text-muted" th:if="${o.soCCCD != null}" th:text="'CCCD: ' + ${o.soCCCD}"></small>
                                            <div th:if="${o.nguoiLienHeKhanCap != null}">
                                                <small class="text-danger"><i class="fas fa-phone-alt me-1"></i>Khẩn cấp: <span th:text="${o.nguoiLienHeKhanCap}"></span> (<span th:text="${o.soDienThoaiKhanCap}"></span>)</small>
                                            </div>
                                        </td>
                                        <td class="text-nowrap">
                                            <div><i class="fas fa-phone text-success me-1"></i><span class="fw-semibold" th:text="${o.soDienThoai}"></span></div>
                                            <small class="text-muted" th:if="${o.email != null}" th:text="${o.email}"></small>
                                        </td>
                                        <td>
                                            <div class="text-secondary small text-truncate" style="max-width: 220px;" th:title="${o.diaChi}" th:text="${o.diaChi}"></div>
                                        </td>
                                        <td class="text-nowrap">
                                            <span class="badge" 
                                                  th:classappend="${o.loaiChuNuoi == 'VIP' ? 'bg-warning text-dark' : (o.loaiChuNuoi == 'Thân thiết' ? 'bg-info text-dark' : 'bg-secondary')}"
                                                  th:text="${o.loaiChuNuoi}"></span>
                                            <div class="small text-muted mt-1"><i class="fas fa-star text-warning me-1"></i><span th:text="${o.diemTichLuy}"></span> điểm</div>
                                        </td>
                                        <td class="text-center text-nowrap">
                                            <a th:href="@{/admin/owners/{id}/pets(id=${o.maChuNuoi})}" class="btn btn-sm btn-outline-info rounded-pill px-2 me-1" title="Xem thú cưng">
                                                <i class="fas fa-paw me-1"></i> Pet
                                            </a>
                                            <a th:href="@{/admin/owners/edit/{id}(id=${o.maChuNuoi})}" class="btn btn-sm btn-outline-warning rounded-pill px-2 me-1" title="Chỉnh sửa">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a th:href="@{/admin/owners/delete/{id}(id=${o.maChuNuoi})}" class="btn btn-sm btn-outline-danger rounded-pill px-2" onclick="return confirm('Bạn có chắc chắn muốn xóa hồ sơ chủ nuôi này?')" title="Xóa">
                                                <i class="fas fa-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(owners)}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="fas fa-user-slash fs-1 d-block mb-3 text-secondary"></i>
                                            Chưa có hồ sơ chủ nuôi nào được ghi nhận.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</div>
