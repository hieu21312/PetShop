<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3 th:if="${voucher.maGiamGia == null}">Thêm mã giảm giá</h3>
            <h3 th:unless="${voucher.maGiamGia == null}">Sửa mã giảm giá</h3>
        </div>
        <div class="card-body">
            <form th:action="@{${voucher.maGiamGia == null ? '/admin/vouchers/create' : '/admin/vouchers/edit/' + voucher.maGiamGia}}" method="post">
                <div class="mb-3">
                    <label>Mã giảm giá</label>
                    <input type="text" name="maGiamGia" class="form-control" th:value="${voucher.maGiamGia}" th:disabled="${voucher.maGiamGia != null}" required>
                    <small th:if="${voucher.maGiamGia != null}" class="text-muted">Không thể sửa mã</small>
                </div>
                <div class="mb-3">
                    <label>Phần trăm giảm (%)</label>
                    <input type="number" step="0.01" name="phanTramGiam" class="form-control" th:value="${voucher.phanTramGiam}" required>
                </div>
                <div class="mb-3">
                    <label>Số tiền giảm tối đa (VNĐ)</label>
                    <input type="number" step="1000" name="soTienGiamToiDa" class="form-control" th:value="${voucher.soTienGiamToiDa}">
                </div>
                <div class="mb-3">
                    <label>Số lượng phát hành</label>
                    <input type="number" name="soLuong" class="form-control" th:value="${voucher.soLuong}" required>
                </div>
                <div class="mb-3">
                    <label>Ngày bắt đầu</label>
                    <input type="date" name="ngayBatDau" class="form-control" th:value="${#temporals.format(voucher.ngayBatDau, 'yyyy-MM-dd')}" required>
                </div>
                <div class="mb-3">
                    <label>Ngày kết thúc</label>
                    <input type="date" name="ngayKetThuc" class="form-control" th:value="${#temporals.format(voucher.ngayKetThuc, 'yyyy-MM-dd')}" required>
                </div>
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/admin/vouchers}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
