<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="fw-bold text-gradient mb-0"><i class="fas fa-calendar-alt me-2"></i> Quản lý lịch đặt dịch vụ</h2>
                </div>

                <!-- QUICK FILTER PILLS -->
                <div class="mb-4">
                    <div class="btn-group shadow-sm p-1 bg-white rounded-pill border" role="group">
                        <a th:href="@{/admin/bookings(status='all')}" 
                           class="btn btn-sm rounded-pill px-3 fw-semibold transition-all"
                           th:classappend="${currentStatus == 'all' or currentStatus == null ? 'btn-primary text-white shadow-sm' : 'btn-light text-secondary'}">
                            Tất cả
                        </a>
                        <a th:href="@{/admin/bookings(status='Chờ xác nhận')}" 
                           class="btn btn-sm rounded-pill px-3 fw-semibold transition-all position-relative"
                           th:classappend="${currentStatus == 'Chờ xác nhận' ? 'btn-warning text-dark shadow-sm fw-bold' : 'btn-light text-secondary'}">
                            <i class="fas fa-clock me-1 text-warning"></i> Chờ xác nhận
                            <span th:if="${pendingBookingCount != null and pendingBookingCount > 0}" 
                                  class="badge bg-danger rounded-pill ms-1" th:text="${pendingBookingCount}">1</span>
                        </a>
                        <a th:href="@{/admin/bookings(status='Đã xác nhận')}" 
                           class="btn btn-sm rounded-pill px-3 fw-semibold transition-all"
                           th:classappend="${currentStatus == 'Đã xác nhận' ? 'btn-info text-white shadow-sm' : 'btn-light text-secondary'}">
                            <i class="fas fa-check-circle me-1 text-info"></i> Đã xác nhận
                        </a>
                        <a th:href="@{/admin/bookings(status='Hoàn thành')}" 
                           class="btn btn-sm rounded-pill px-3 fw-semibold transition-all"
                           th:classappend="${currentStatus == 'Hoàn thành' ? 'btn-success text-white shadow-sm' : 'btn-light text-secondary'}">
                            <i class="fas fa-flag-checkered me-1 text-success"></i> Hoàn thành
                        </a>
                        <a th:href="@{/admin/bookings(status='Đã hủy')}" 
                           class="btn btn-sm rounded-pill px-3 fw-semibold transition-all"
                           th:classappend="${currentStatus == 'Đã hủy' ? 'btn-secondary text-white shadow-sm' : 'btn-light text-secondary'}">
                            <i class="fas fa-times-circle me-1 text-muted"></i> Đã hủy
                        </a>
                    </div>
                </div>

                <div class="row g-3 mb-4" th:if="${staffStats != null}">
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-success-subtle text-success p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                    <i class="fas fa-user-md fa-lg"></i>
                                </div>
                                <div>
                                    <small class="text-muted d-block fw-semibold">Bác sĩ đang rảnh</small>
                                    <span class="fs-4 fw-bold text-success" th:text="${staffStats.vetFree}">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-danger-subtle text-danger p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                    <i class="fas fa-stethoscope fa-lg"></i>
                                </div>
                                <div>
                                    <small class="text-muted d-block fw-semibold">Bác sĩ đang làm</small>
                                    <span class="fs-4 fw-bold text-danger" th:text="${staffStats.vetBusy}">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-success-subtle text-success p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                    <i class="fas fa-user-check fa-lg"></i>
                                </div>
                                <div>
                                    <small class="text-muted d-block fw-semibold">Nhân viên đang rảnh</small>
                                    <span class="fs-4 fw-bold text-success" th:text="${staffStats.careFree}">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-warning-subtle text-warning p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                    <i class="fas fa-cut fa-lg"></i>
                                </div>
                                <div>
                                    <small class="text-muted d-block fw-semibold">Nhân viên đang làm</small>
                                    <span class="fs-4 fw-bold text-dark" th:text="${staffStats.careBusy}">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-pink text-nowrap">
                                <tr>
                                    <th class="ps-3 text-nowrap">Mã Đặt</th>
                                    <th class="text-nowrap">Dịch Vụ</th>
                                    <th class="text-nowrap">Khách Hàng</th>
                                    <th class="text-nowrap">Ngày &amp; Giờ</th>
                                    <th class="text-nowrap">Nhân Sự Phụ Trách</th>
                                    <th class="text-nowrap text-center">Trạng Thái</th>
                                    <th class="pe-3 text-end text-nowrap">Thao Tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="b : ${bookings}">
                                    <td class="ps-3 text-nowrap">
                                        <span class="badge bg-light text-danger border fw-bold px-3 py-2 rounded-pill" th:text="'#BK' + ${b.maDatLich}"></span>
                                    </td>
                                    <td class="text-nowrap">
                                        <span class="badge role-badge px-3 py-2 rounded-pill" th:text="'🐾 Service #' + ${b.maDV}"></span>
                                    </td>
                                    <td class="text-nowrap">
                                        <strong class="d-block text-dark" th:text="${b.tenKhachHang}"></strong>
                                        <small class="text-muted"><i class="fas fa-phone me-1 text-muted"></i><span th:text="${b.soDienThoai}"></span></small>
                                    </td>
                                    <td class="text-nowrap">
                                        <small class="d-block text-dark fw-semibold"><i class="far fa-calendar-alt me-1 text-muted"></i><span th:text="${#temporals.format(b.ngayDat, 'dd/MM/yyyy')}"></span></small>
                                        <small class="text-muted"><i class="far fa-clock me-1"></i><span th:text="${b.gioDat}"></span></small>
                                    </td>
                                    <td class="text-nowrap">
                                        <form th:action="@{/admin/bookings/assignStaff}" method="post" class="d-inline">
                                            <input type="hidden" name="id" th:value="${b.maDatLich}">
                                            <select name="maNV" class="form-select form-select-sm rounded-pill shadow-sm d-inline-block px-2 py-1 border-1" style="max-width: 170px; font-size: 0.82rem;" onchange="this.form.submit()">
                                                <option value="">-- Chưa phân --</option>
                                                <optgroup label="👨‍⚕️ Bác sĩ thú y">
                                                    <option th:each="e : ${employees}"
                                                            th:if="${e.role != null and e.role.tenVaiTro == 'Bác sĩ thú y'}"
                                                            th:value="${e.maNV}"
                                                            th:selected="${b.maNV == e.maNV}"
                                                            th:title="${e.tenNV} + (${e.chuyenMon != null and !e.chuyenMon.isEmpty()} ? ' (' + ${e.chuyenMon} + ')' : '')"
                                                            th:text="${e.tenNV} + ' - ' + (${e.soCaDangLam == 0 ? '🟢 Rảnh' : '🔴 Bận ' + e.soCaDangLam})">
                                                    </option>
                                                </optgroup>
                                                <optgroup label="✂️ Staff Spa / Chăm sóc">
                                                    <option th:each="e : ${employees}"
                                                            th:if="${e.role == null or e.role.tenVaiTro != 'Bác sĩ thú y'}"
                                                            th:value="${e.maNV}"
                                                            th:selected="${b.maNV == e.maNV}"
                                                            th:title="${e.tenNV} + (${e.role != null} ? ' (' + ${e.role.tenVaiTro} + ')' : '')"
                                                            th:text="${e.tenNV} + ' - ' + (${e.soCaDangLam == 0 ? '🟢 Rảnh' : '🔴 Bận ' + e.soCaDangLam})">
                                                    </option>
                                                </optgroup>
                                            </select>
                                        </form>
                                        <div th:each="e : ${employees}" th:if="${e.maNV == b.maNV}" class="mt-1">
                                            <span th:if="${e.soCaDangLam == 0}" class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-1" style="font-size: 0.72rem;">
                                                <i class="fas fa-check-circle me-1"></i>🟢 Đang rảnh
                                            </span>
                                            <span th:if="${e.soCaDangLam > 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2 py-1" style="font-size: 0.72rem;">
                                                <i class="fas fa-briefcase me-1"></i>🔴 Đang làm (<span th:text="${e.soCaDangLam}"></span> ca)
                                            </span>
                                        </div>
                                    </td>
                                    <td class="text-center text-nowrap">
                                        <span class="badge px-3 py-2 rounded-pill text-nowrap"
                                              th:classappend="${b.trangThai == 'Chờ xác nhận' ? 'bg-warning text-dark' : (b.trangThai == 'Đã xác nhận' ? 'bg-primary text-white' : (b.trangThai == 'Hoàn thành' ? 'bg-success text-white' : 'bg-secondary text-white'))}">
                                            <i class="fas fa-circle me-1" style="font-size: 7px;"></i>
                                            <span th:text="${b.trangThai}"></span>
                                        </span>
                                    </td>
                                    <td class="pe-3 text-end text-nowrap">
                                        <div class="d-inline-flex align-items-center gap-2">
                                            <form th:action="@{/admin/bookings/updateStatus}" method="post" class="d-inline">
                                                <input type="hidden" name="id" th:value="${b.maDatLich}">
                                                <select name="status" class="form-select form-select-sm rounded-pill shadow-sm d-inline-block w-auto px-3 py-1" onchange="this.form.submit()">
                                                    <option value="Chờ xác nhận" th:selected="${b.trangThai == 'Chờ xác nhận'}">Chờ xác nhận</option>
                                                    <option value="Đã xác nhận" th:selected="${b.trangThai == 'Đã xác nhận'}">Đã xác nhận</option>
                                                    <option value="Hoàn thành" th:selected="${b.trangThai == 'Hoàn thành'}">Hoàn thành</option>
                                                    <option value="Đã hủy" th:selected="${b.trangThai == 'Đã hủy'}">Đã hủy</option>
                                                </select>
                                            </form>
                                            <a th:href="@{/admin/bookings/delete/{id}(id=${b.maDatLich})}" class="btn btn-sm btn-danger" title="Xóa lịch đặt" onclick="return confirm('Bạn có chắc chắn muốn xóa lịch đặt này?')">Xóa</a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(bookings)}">
                                    <td colspan="7" class="text-center py-4 text-muted">Chưa có lịch đặt dịch vụ nào</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
