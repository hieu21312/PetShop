<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white py-3 border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0 text-gradient">
                            <i class="fas fa-paw text-warning me-2"></i>
                            <span th:text="${pet.maThuCung == null ? 'Đăng ký hồ sơ thú cưng mới' : 'Cập nhật hồ sơ thú cưng'}"></span>
                        </h4>
                        <a th:href="@{/admin/pets}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form th:action="${pet.maThuCung == null ? '/admin/pets/create' : '/admin/pets/edit/' + pet.maThuCung}"
                          method="post" th:object="${pet}">

                        <h6 class="fw-bold text-primary mb-3"><i class="fas fa-info-circle me-2"></i>Thông tin cơ bản & Chủ sở hữu</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Chủ nuôi sở hữu <span class="text-danger">*</span></label>
                                <select th:field="*{maChuNuoi}" class="form-select rounded-3" required>
                                    <option value="" disabled selected>-- Chọn chủ nuôi --</option>
                                    <option th:each="o : ${owners}" 
                                            th:value="${o.maChuNuoi}" 
                                            th:text="${o.hoTenChuNuoi} + ' (' + ${o.soDienThoai} + ')'"
                                            th:selected="${pet.maChuNuoi == o.maChuNuoi}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Tên thú cưng <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{tenThuCung}" class="form-control rounded-3" placeholder="Ví dụ: Bông, Milu, Lucky, Miu..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Loài thú cưng <span class="text-danger">*</span></label>
                                <select th:field="*{loaiThuCung}" class="form-select rounded-3" required>
                                    <option value="Chó">🐶 Chó</option>
                                    <option value="Mèo">🐱 Mèo</option>
                                    <option value="Thỏ">🐰 Thỏ</option>
                                    <option value="Chuột Hamster">🐹 Chuột Hamster</option>
                                    <option value="Khác">🐾 Khác</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Giống loài cụ thể <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{giongLoai}" class="form-control rounded-3" placeholder="Ví dụ: Poodle, Corgi, Mèo Anh lông ngắn..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Giới tính</label>
                                <select th:field="*{gioiTinh}" class="form-select rounded-3">
                                    <option value="Đực">Đực</option>
                                    <option value="Cái">Cái</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Đã triệt sản?</label>
                                <select th:field="*{trietSan}" class="form-select rounded-3">
                                    <option value="false">Chưa triệt sản</option>
                                    <option value="true">Đã triệt sản</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Cân nặng (kg)</label>
                                <input type="number" step="0.1" th:field="*{canNang}" class="form-control rounded-3" placeholder="Ví dụ: 4.5">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Màu lông</label>
                                <input type="text" th:field="*{mauSac}" class="form-control rounded-3" placeholder="Ví dụ: Nâu đỏ, Vàng trắng">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Ngày sinh</label>
                                <input type="date" th:field="*{ngaySinh}" class="form-control rounded-3">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Đặc điểm nhận dạng</label>
                                <input type="text" th:field="*{dacDiemNhanDang}" class="form-control rounded-3" placeholder="Đốm mắt phải, đuôi cộc, tai cụp...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mã số vi mạch (Microchip)</label>
                                <input type="text" th:field="*{soMicrochip}" class="form-control rounded-3" placeholder="MC-981001-VN...">
                            </div>
                        </div>

                        <h6 class="fw-bold text-danger mb-3"><i class="fas fa-heartbeat me-2"></i>Sức khỏe & Y tế</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Tình trạng sức khỏe hiện tại</label>
                                <textarea th:field="*{tinhTrangSucKhoeHienTai}" class="form-control rounded-3" rows="2" placeholder="Sức khỏe tốt, da bóng mượt, không ve rận..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tiền sử bệnh lý</label>
                                <textarea th:field="*{tienSuBenhLy}" class="form-control rounded-3" rows="2" placeholder="Từng bị Parvo, viêm tai lúc nhỏ..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Dị ứng thuốc / thức ăn</label>
                                <input type="text" th:field="*{diUngThuocThucAn}" class="form-control rounded-3" placeholder="Dị ứng hải sản, dị ứng xà phòng có cồn...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Lịch sử tiêm chủng</label>
                                <input type="text" th:field="*{lichSuTiemChung}" class="form-control rounded-3" placeholder="Đã tiêm 3 mũi 7 bệnh và 1 mũi Dại...">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Ghi chú & Thói quen đặc biệt</label>
                            <textarea th:field="*{ghiChu}" class="form-control rounded-3" rows="2" placeholder="Thích massage bụng, sợ tiếng máy sấy..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/pets}" class="btn btn-light px-4 rounded-pill">Hủy bỏ</a>
                            <button type="submit" class="btn btn-warning text-dark fw-bold px-5 rounded-pill shadow-sm">
                                <i class="fas fa-save me-1"></i> Lưu hồ sơ thú cưng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
