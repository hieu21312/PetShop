<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-gradient"><i class="fas fa-tags"></i> Quản lý danh mục</h2>
                    <a th:href="@{/admin/categories/create}" class="btn btn-success">
                        <i class="fas fa-plus"></i> Thêm danh mục
                    </a>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-pink">
                            <tr>
                                <th>Mã danh mục</th>
                                <th>Tên danh mục</th>
                                <th>Ghi chú</th>
                                <th width="150">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${categories}">
                                <td th:text="${c.maDanhMuc}"></td>
                                <td th:text="${c.tenDanhMuc}"></td>
                                <td th:text="${c.ghiChu}"></td>
                                <td>
                                    <a th:href="@{/admin/categories/edit/{id}(id=${c.maDanhMuc})}" class="btn btn-sm btn-warning">Sửa</a>
                                    <a th:href="@{/admin/categories/delete/{id}(id=${c.maDanhMuc})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa danh mục?')">Xóa</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-4">Chưa có danh mục nào</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
