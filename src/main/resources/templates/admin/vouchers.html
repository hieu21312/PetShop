<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3"><div th:replace="~{admin/admin-sidebar :: sidebar}"></div></div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold text-gradient"><i class="fas fa-ticket-alt me-2"></i> Quản lý mã giảm giá</h2><a th:href="@{/admin/vouchers/create}" class="btn add-btn"><i class="fas fa-plus"></i> Thêm mã giảm giá</a></div>
                <div class="card border-0 shadow-sm"><div class="card-body p-0"><table class="table table-hover mb-0"><thead class="table-pink"><tr><th>Mã</th><th>Giảm</th><th>Tối đa</th><th>Số lượng</th><th>Bắt đầu</th><th>Kết thúc</th><th width="140">Thao tác</th></tr></thead><tbody><tr th:each="v : ${vouchers}"><td><div class="voucher-code"><i class="fas fa-ticket-alt"></i><span th:text="${v.maGiamGia}"></span></div></td><td><span class="discount-badge" th:text="${v.phanTramGiam} + '%'"></span></td><td class="fw-semibold text-danger" th:text="${#numbers.formatDecimal(v.soTienGiamToiDa, 0, 0, 'COMMA')} + ' đ'"></td><td><span class="quantity-badge" th:text="${v.soLuong}"></span></td><td th:text="${#temporals.format(v.ngayBatDau, 'dd/MM/yyyy')}"></td><td th:text="${#temporals.format(v.ngayKetThuc, 'dd/MM/yyyy')}"></td><td><div class="action-group"><a th:href="@{/admin/vouchers/edit/{id}(id=${v.maGiamGia})}" class="btn-action btn-edit-text"><i class="fas fa-pen-to-square"></i> Sửa</a><a th:href="@{/admin/vouchers/delete/{id}(id=${v.maGiamGia})}" class="btn-action btn-delete-text" onclick="return confirm('Xóa mã giảm giá?')"><i class="fas fa-trash"></i> Xóa</a></div></td></tr><tr th:if="${#lists.isEmpty(vouchers)}"><td colspan="7" class="text-center py-4">Chưa có mã giảm giá nào</td></tr></tbody></table></div></div>
            </div>
        </div>
    </section>
</div>
