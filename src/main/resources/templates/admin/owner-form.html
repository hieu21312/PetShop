<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white py-3 border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0 text-gradient">
                            <i class="fas fa-id-card text-primary me-2"></i>
                            <span th:text="${owner.maChuNuoi == null ? 'Thêm hồ sơ chủ nuôi mới' : 'Cập nhật hồ sơ chủ nuôi'}"></span>
                        </h4>
                        <a th:href="@{/admin/owners}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                    </div>
                </div>
                <div class="card-body p-4">
                    <form th:action="${owner.maChuNuoi == null ? '/admin/owners/create' : '/admin/owners/edit/' + owner.maChuNuoi}"
                          method="post" th:object="${owner}">

                        <h6 class="fw-bold text-primary mb-3"><i class="fas fa-user me-2"></i>Thông tin cá nhân</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Họ và tên chủ nuôi <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{hoTenChuNuoi}" class="form-control rounded-3" placeholder="Ví dụ: Nguyễn Văn An" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="tel" th:field="*{soDienThoai}" class="form-control rounded-3" placeholder="Ví dụ: 0909123456" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control rounded-3" placeholder="email@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số CCCD / CMND</label>
                                <input type="text" th:field="*{soCCCD}" class="form-control rounded-3" placeholder="Số căn cước lưu hồ sơ">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Giới tính</label>
                                <select th:field="*{gioiTinh}" class="form-select rounded-3">
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ngày sinh</label>
                                <input type="date" th:field="*{ngaySinh}" class="form-control rounded-3">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Hạng thành viên</label>
                                <select th:field="*{loaiChuNuoi}" class="form-select rounded-3">
                                    <option value="Tiêu chuẩn">Tiêu chuẩn</option>
                                    <option value="Thân thiết">Thân thiết</option>
                                    <option value="VIP">VIP</option>
                                    <option value="VVIP">VVIP</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Địa chỉ nơi ở</label>
                                <input type="text" th:field="*{diaChi}" class="form-control rounded-3" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành">
                            </div>
                        </div>

                        <h6 class="fw-bold text-danger mb-3"><i class="fas fa-phone-alt me-2"></i>Liên hệ khẩn cấp (Khi thú cưng gặp sự cố)</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Tên người thân / Mối quan hệ</label>
                                <input type="text" th:field="*{nguoiLienHeKhanCap}" class="form-control rounded-3" placeholder="Ví dụ: Trần Thị Mai (Vợ)">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại khẩn cấp</label>
                                <input type="tel" th:field="*{soDienThoaiKhanCap}" class="form-control rounded-3" placeholder="Ví dụ: 0989112233">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Ghi chú riêng về chủ nuôi</label>
                            <textarea th:field="*{ghiChu}" class="form-control rounded-3" rows="3" placeholder="Yêu cầu đặc biệt, tính cách hoặc lưu ý khi phục vụ..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/owners}" class="btn btn-light px-4 rounded-pill">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm">
                                <i class="fas fa-save me-1"></i> Lưu hồ sơ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
