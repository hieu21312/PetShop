<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-gradient"><i class="fas fa-users me-2"></i> Quản lý khách hàng</h2>
                    <span class="badge bg-danger fs-6 px-3 py-2">Tổng: <span th:text="${#lists.size(customers)}"></span> khách hàng</span>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-pink">
                            <tr><th>Mã KH</th><th>Khách hàng</th><th>Email</th><th>Điện thoại</th><th>Địa chỉ</th><th width="150">Thao tác</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="c : ${customers}">
                                <td><span class="fw-bold text-danger" th:text="${c.maKH}"></span></td>
                                <td><div class="d-flex align-items-center"><div class="customer-avatar me-2"><i class="fas fa-user"></i></div><span th:text="${c.tenKH}"></span></div></td>
                                <td th:text="${c.email}"></td>
                                <td th:text="${c.dienThoai}"></td>
                                <td th:text="${c.diaChi}"></td>
                                <td><a th:href="@{/admin/customers/orders/{id}(id=${c.maKH})}" class="btn btn-detail btn-sm"><i class="fas fa-shopping-cart"></i> Đơn hàng</a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(customers)}"><td colspan="6" class="text-center py-4">Chưa có khách hàng nào</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
