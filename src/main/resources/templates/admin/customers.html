<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3">
                <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-gradient"><i class="fas fa-users me-2"></i> Quản lý khách hàng</h2>
                    <span class="badge bg-danger fs-6 px-3 py-2">Tổng: <span th:text="${#lists.size(customers)}"></span> khách hàng</span>
                </div>
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-pink">
                                    <tr>
                                        <th class="ps-3 text-nowrap">Mã KH</th>
                                        <th class="text-nowrap">Khách hàng</th>
                                        <th class="text-nowrap">Email</th>
                                        <th class="text-nowrap">Điện thoại</th>
                                        <th class="text-nowrap">Hạng thành viên</th>
                                        <th class="text-nowrap">Địa chỉ</th>
                                        <th class="text-end pe-3 text-nowrap">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="c : ${customers}">
                                        <td class="ps-3 fw-bold text-danger" th:text="${c.maKH}"></td>
                                        <td class="text-nowrap fw-semibold text-dark" th:text="${c.tenKH}"></td>
                                        <td class="text-nowrap" th:text="${c.email}"></td>
                                        <td class="text-nowrap" th:text="${c.dienThoai}"></td>
                                        <td class="text-nowrap">
                                            <span class="badge" 
                                                  th:classappend="${c.hangThanhVien == 'VVIP' ? 'bg-danger' : (c.hangThanhVien == 'VIP' ? 'bg-warning text-dark' : (c.hangThanhVien != null and c.hangThanhVien.contains('Thân') ? 'bg-info text-dark' : 'bg-secondary'))}"
                                                  th:text="${c.hangThanhVien != null and c.hangThanhVien.contains('Thân') ? 'Thân thiết' : (c.hangThanhVien != null and c.hangThanhVien.contains('Tiêu') ? 'Tiêu chuẩn' : (c.hangThanhVien ?: 'Tiêu chuẩn'))}">
                                            </span>
                                            <div class="small text-muted mt-1">
                                                <i class="fas fa-star text-warning me-1"></i><span th:text="${c.diemTichLuy ?: 0}"></span> điểm
                                            </div>
                                        </td>
                                        <td class="text-nowrap" th:text="${c.diaChi}"></td>
                                        <td class="text-end pe-3 text-nowrap">
                                            <a th:href="@{/admin/customers/orders/{id}(id=${c.maKH})}" class="btn btn-detail btn-sm rounded-pill px-3 shadow-sm">
                                                <i class="fas fa-shopping-cart me-1"></i>Đơn hàng
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(customers)}">
                                        <td colspan="7" class="text-center py-4 text-muted">Chưa có khách hàng nào</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
