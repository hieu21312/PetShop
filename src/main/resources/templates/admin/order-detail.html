<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold text-gradient">
            <i class="fas fa-file-invoice me-2"></i>
            Chi tiết đơn hàng #<span th:text="${order.maHD}"></span>
        </h2>

        <a th:href="@{/admin/orders}"
           class="btn btn-secondary rounded-pill px-4">

            <i class="fas fa-arrow-left me-2"></i>
            Quay lại

        </a>

    </div>

    <!-- THÔNG TIN ĐƠN HÀNG -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-header table-pink py-3">
            <h5 class="mb-0">
                <i class="fas fa-info-circle me-2"></i>
                Thông tin đơn hàng
            </h5>
        </div>

        <div class="card-body p-4">

            <form th:action="@{/admin/orders/update}" method="post">

                <input type="hidden"
                       name="maHD"
                       th:value="${order.maHD}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Khách hàng
                            <span th:if="${order.customer != null}"
                                  class="badge ms-2"
                                  th:classappend="${order.customer.hangThanhVien == 'VVIP' ? 'bg-danger' : (order.customer.hangThanhVien == 'VIP' ? 'bg-warning text-dark' : (order.customer.hangThanhVien == 'Thân thiết' ? 'bg-info text-dark' : 'bg-secondary'))}"
                                  th:text="${order.customer.hangThanhVien ?: 'Tiêu chuẩn'}">
                            </span>
                            <span th:if="${order.customer != null}" class="text-muted small fw-normal ms-1">
                                (<i class="fas fa-star text-warning"></i> <span th:text="${order.customer.diemTichLuy ?: 0}"></span> điểm)
                            </span>
                        </label>
                        <input type="text"
                               class="form-control"
                               th:value="${order.customer != null ? order.customer.tenKH : 'N/A'}"
                               disabled>
                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Ngày lập
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${#temporals.format(order.ngayLap,'dd/MM/yyyy HH:mm')}"
                               disabled>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">
                            Tình trạng
                        </label>

                        <select name="tinhTrang"
                                class="form-select">

                            <option
                                    th:each="s : ${statuses}"
                                    th:value="${s.id}"
                                    th:text="${s.tinhTrangDonHang}"
                                    th:selected="${s.id == order.tinhTrang}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">
                            Thanh toán & Tích điểm
                        </label>
                        <div class="d-flex align-items-center flex-wrap gap-2 mt-2">
                            <div class="form-check me-2">
                                <input type="checkbox"
                                       name="daThanhToan"
                                       value="true"
                                       class="form-check-input"
                                       th:checked="${order.daThanhToan}">
                                <label class="form-check-label fw-semibold">
                                    Đã thanh toán
                                </label>
                            </div>
                            <span th:if="${order.daCongDiem}" class="badge bg-success-subtle text-success border border-success-subtle py-2 px-3">
                                <i class="fas fa-check-circle me-1"></i> Đã cộng +<span th:text="${pointsEarned}"></span> điểm
                            </span>
                            <span th:unless="${order.daCongDiem}" class="badge bg-light text-muted border py-2 px-3">
                                <i class="fas fa-star text-warning me-1"></i> Tích lũy +<span th:text="${pointsEarned}"></span> điểm (khi lưu Đã thanh toán)
                            </span>
                        </div>
                    </div>

                    <div class="col-12 mb-4">

                        <label class="form-label fw-semibold">
                            Địa chỉ giao hàng
                        </label>

                        <input type="text"
                               name="diaChiGiaoHang"
                               class="form-control"
                               th:value="${order.diaChiGiaoHang}">

                    </div>

                </div>

                <button type="submit"
                        class="btn add-btn">

                    <i class="fas fa-save me-2"></i>
                    Cập nhật đơn hàng

                </button>

            </form>

        </div>

    </div>

    <!-- SẢN PHẨM -->

    <div class="card border-0 shadow-sm">

        <div class="card-header table-pink py-3">
            <h5 class="mb-0">
                <i class="fas fa-shopping-bag me-2"></i>
                Sản phẩm trong đơn
            </h5>
        </div>

        <div class="card-body p-0">

            <table class="table table-hover mb-0">

                <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th width="120">Số lượng</th>
                    <th width="180">Đơn giá</th>
                    <th width="180">Thành tiền</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="detail : ${order.orderDetails}">
                    <td th:text="${detail.product.tenSP}"></td>
                    <td th:text="${detail.soLuong}"></td>
                    <td th:text="${detail.giaBan != null ? #numbers.formatDecimal(detail.giaBan, 1, 'POINT', 0, 'COMMA') + 'VND' : '0VND'}"></td>
                    <td th:text="${(detail.soLuong != null and detail.giaBan != null) ? #numbers.formatDecimal(detail.soLuong * detail.giaBan, 1, 'POINT', 0, 'COMMA') + 'VND' : '0VND'}"></td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
