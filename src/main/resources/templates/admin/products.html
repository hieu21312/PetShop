<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row">
            <div class="col-md-3"><div th:replace="~{admin/admin-sidebar :: sidebar}"></div></div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="fw-bold text-gradient"><i class="fas fa-shopping-bag"></i> Quản lý sản phẩm</h2><a th:href="@{/admin/products/create}" class="btn btn-success px-4 rounded-pill shadow-sm"><i class="fas fa-plus me-1"></i> Thêm mới</a></div>
                <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-pink"><tr><th>ID</th><th>Tên sản phẩm</th><th>Loại</th><th>Giá</th><th class="text-center">Thao tác</th></tr></thead><tbody><tr th:each="p : ${products}"><td class="fw-semibold" th:text="${p.maSP}"></td><td><div class="fw-bold" th:text="${p.tenSP}"></div></td><td><span class="badge bg-primary" th:text="${p.loaiSanPham}"></span></td><td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.giaBan, 0, 0, 'COMMA')} + ' đ'"></td><td class="text-center"><a th:href="@{/admin/products/edit/{id}(id=${p.maSP})}" class="btn btn-sm btn-warning rounded-pill px-3">Sửa</a> <a th:href="@{/admin/products/delete/{id}(id=${p.maSP})}" class="btn btn-sm btn-danger rounded-pill px-3" onclick="return confirm('Xóa sản phẩm?')">Xóa</a></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="5" class="text-center py-4">Chưa có sản phẩm nào</td></tr></tbody></table></div></div></div>
            </div>
        </div>
    </section>
</div>
