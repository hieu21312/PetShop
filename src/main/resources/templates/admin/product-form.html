<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 th:if="${product.maSP == null}">Thêm sản phẩm mới</h4>
            <h4 th:unless="${product.maSP == null}">Sửa sản phẩm</h4>
        </div>
        <div class="card-body">
            <!-- Hiển thị thông báo lỗi từ session (VD: thiếu ảnh) -->
            <div th:if="${session.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${session.error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="${product.maSP == null ? '/admin/products/create' : '/admin/products/edit/' + product.maSP}"
                  method="post" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Tên sản phẩm</label>
                        <input type="text" name="tenSP" class="form-control" th:value="${product.tenSP}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Loại sản phẩm</label>
                        <select name="loaiSanPham" class="form-select">
                            <option value="Pet" th:selected="${product.loaiSanPham == 'Pet'}">Thú cưng (Pet)</option>
                            <option value="Accessory" th:selected="${product.loaiSanPham == 'Accessory'}">Phụ kiện (Accessory)</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Giá bán (VNĐ)</label>
                        <input type="number" name="giaBan" class="form-control" th:value="${product.giaBan}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Ảnh đại diện</label>
                        <input type="file" name="fileImage" class="form-control" accept="image/*" th:required="${product.maSP == null}">
                        <small class="text-muted" th:if="${product.maSP != null}">Để trống nếu không muốn đổi ảnh mới</small>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Danh mục</label>
                        <select name="maDanhMuc" class="form-select">
                            <option th:each="cat : ${categories}" th:value="${cat.maDanhMuc}" th:text="${cat.tenDanhMuc}"
                                    th:selected="${product.maDanhMuc == cat.maDanhMuc}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Nhà cung cấp</label>
                        <select name="maNCC" class="form-select">
                            <option th:each="sup : ${suppliers}" th:value="${sup.maNCC}" th:text="${sup.tenNCC}"
                                    th:selected="${product.maNCC == sup.maNCC}"></option>
                        </select>
                    </div>
                </div>

                <h5 class="mt-3">Thông tin chi tiết (Dành cho Thú cưng)</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Giới tính</label>
                        <select name="gioiTinh" class="form-select">
                            <option value="Đực" th:selected="${product.gioiTinh == 'Đực'}">Đực</option>
                            <option value="Cái" th:selected="${product.gioiTinh == 'Cái'}">Cái</option>
                            <option value="Không xác định" th:selected="${product.gioiTinh == 'Không xác định'}">Không xác định</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Ngày sinh</label>
                        <input type="date" name="ngaySinh" class="form-control" th:value="${#temporals.format(product.ngaySinh, 'yyyy-MM-dd')}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label>Màu sắc</label>
                        <input type="text" name="mauSac" class="form-control" th:value="${product.mauSac}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Tình trạng sức khỏe</label>
                        <input type="text" name="tinhTrangSucKhoe" class="form-control" th:value="${product.tinhTrangSucKhoe}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Tiền sử bệnh</label>
                        <input type="text" name="tienSuBenh" class="form-control" th:value="${product.tienSuBenh}">
                    </div>
                </div>

                <div class="mb-3">
                    <label>Mô tả chi tiết</label>
                    <textarea name="moTa" class="form-control" rows="4" th:text="${product.moTa}"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                <a th:href="@{/admin/products}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
