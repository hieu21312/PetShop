<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <a th:href="@{/DonHang/CuaToi}" class="text-decoration-none text-muted small mb-2 d-inline-block">
                        <i class="fas fa-arrow-left me-1"></i> Quay lại danh sách đơn hàng
                    </a>
                    <h2 class="fw-bold text-gradient mb-0">
                        <i class="fas fa-file-invoice me-2"></i> Chi tiết đơn hàng <span class="text-danger" th:text="'#DH' + ${order.maHD}"></span>
                    </h2>
                </div>
                <div class="d-flex align-items-center gap-2 no-print">
                    <button type="button" onclick="window.print()" class="btn btn-outline-secondary rounded-pill px-3 shadow-sm">
                        <i class="fas fa-print me-1"></i> In hóa đơn
                    </button>
                    <form th:if="${order.tinhTrang == 1}" th:action="@{/DonHang/Huy/{id}(id=${order.maHD})}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này không?');" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger rounded-pill px-3 shadow-sm">
                            <i class="fas fa-times-circle me-1"></i> Hủy đơn hàng
                        </button>
                    </form>
                    <span class="badge px-3 py-2 rounded-pill fs-6"
                          th:classappend="${order.tinhTrang == 1 ? 'bg-warning text-dark' : (order.tinhTrang == 2 ? 'bg-primary' : (order.tinhTrang == 3 ? 'bg-info text-dark' : (order.tinhTrang == 4 ? 'bg-success' : 'bg-danger')))}"
                          th:text="${order.orderStatus != null ? order.orderStatus.tinhTrangDonHang : (order.tinhTrang == 1 ? 'Chờ xác nhận' : (order.tinhTrang == 2 ? 'Đã xác nhận' : (order.tinhTrang == 3 ? 'Đang giao hàng' : (order.tinhTrang == 4 ? 'Hoàn thành' : 'Đã hủy'))))}">
                    </span>
                </div>
            </div>

            <!-- Flash alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm no-print" role="alert">
                <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm no-print" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Thông tin đơn hàng & giao vận -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="fas fa-map-marker-alt me-2 text-danger"></i>Thông tin nhận hàng</h5>
                            <div class="mb-2">
                                <small class="text-muted d-block">Địa chỉ nhận hàng:</small>
                                <strong class="text-dark" th:text="${order.diaChiGiaoHang}"></strong>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted d-block">Thời gian đặt:</small>
                                <span class="text-secondary" th:text="${#temporals.format(order.ngayLap, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted d-block">Phương thức thanh toán:</small>
                                <strong class="text-dark" th:text="${order.hinhThucThanhToan ?: 'COD (Thanh toán khi nhận)'}"></strong>
                            </div>
                            <div>
                                <small class="text-muted d-block">Trạng thái thanh toán:</small>
                                <span class="badge" th:classappend="${order.daThanhToan ? 'bg-success' : 'bg-secondary'}"
                                      th:text="${order.daThanhToan ? 'Đã thanh toán' : 'Chưa thanh toán'}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="fas fa-receipt me-2 text-primary"></i>Tóm tắt thanh toán</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Mã giảm giá áp dụng:</span>
                                <strong class="text-success" th:text="${order.maGiamGia ?: 'Không có'}"></strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2" th:if="${order.tienGiam != null and order.tienGiam > 0}">
                                <span class="text-muted">Số tiền giảm giá:</span>
                                <strong class="text-danger" th:text="'-' + ${#numbers.formatDecimal(order.tienGiam, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <strong class="fs-5 text-dark">Tổng cộng:</strong>
                                <strong class="fs-4 text-danger" th:text="${#numbers.formatDecimal(order.tongTien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Danh sách sản phẩm -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                            <h5 class="fw-bold text-dark"><i class="fas fa-boxes me-2 text-primary"></i>Danh sách sản phẩm trong đơn</h5>
                        </div>
                        <div class="card-body p-4">
                            <div class="table-responsive">
                                <table class="table align-middle">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Sản phẩm</th>
                                        <th class="text-center">Đơn giá</th>
                                        <th class="text-center">Số lượng</th>
                                        <th class="text-end">Thành tiền</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="d : ${details}">
                                        <td>
                                            <div class="d-flex align-items-center gap-3">
                                                <img th:if="${d.product != null and d.product.hinhAnh != null}"
                                                     th:src="@{${d.product.hinhAnh}}"
                                                     style="width: 55px; height: 55px; object-fit: cover; border-radius: 8px;">
                                                <div>
                                                    <strong class="text-dark d-block" th:text="${d.product != null ? d.product.tenSP : 'Sản phẩm #' + d.id.maSP}"></strong>
                                                    <small class="text-muted" th:text="'Mã SP: #' + ${d.id.maSP}"></small>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-center" th:text="${#numbers.formatDecimal(d.giaBan, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                        <td class="text-center fw-bold" th:text="'x' + ${d.soLuong}"></td>
                                        <td class="text-end fw-bold text-danger"
                                            th:text="${#numbers.formatDecimal(d.giaBan * d.soLuong, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
