<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-gradient mb-0">
            <i class="fas fa-calendar-alt me-2"></i> Lịch Sử Đặt Dịch Vụ Của Tôi
        </h3>
        <a th:href="@{/DichVu}" class="btn btn-success rounded-pill px-4 shadow-sm">
            <i class="fas fa-plus-circle me-1"></i> Đặt thêm dịch vụ mới
        </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <!-- Tra cứu lịch hẹn bằng SĐT cho Khách chưa đăng nhập -->
    <div th:if="${session.maKH == null}" class="card shadow-sm border-0 rounded-4 mb-4" style="background: #fff0f3;">
        <div class="card-body p-3">
            <form th:action="@{/LichSuDatLich}" method="get" class="row g-2 align-items-center">
                <div class="col-auto">
                    <label class="fw-bold text-dark"><i class="fas fa-search me-1" style="color: #ff4d6d;"></i> Tra cứu lịch hẹn qua SĐT:</label>
                </div>
                <div class="col-auto">
                    <input type="tel" name="searchPhone" class="form-control form-control-sm rounded-pill px-3"
                           th:value="${searchPhone}" placeholder="Ví dụ: 0852236333" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-sm text-white rounded-pill px-3 shadow-sm" style="background: linear-gradient(45deg, #ff4d6d, #ff758f); border: none;">
                        Tra cứu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-pink text-nowrap">
                    <tr>
                        <th class="ps-4 text-nowrap">Mã lịch</th>
                        <th class="text-nowrap">Ngày hẹn</th>
                        <th class="text-nowrap">Khung giờ</th>
                        <th class="text-nowrap">Họ tên</th>
                        <th class="text-nowrap">SĐT</th>
                        <th class="text-nowrap">Ghi chú</th>
                        <th class="text-nowrap text-center">Trạng thái</th>
                        <th class="pe-4 text-end text-nowrap">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="b : ${bookings}">
                        <td class="ps-4 fw-bold text-nowrap" th:text="'#' + ${b.maDatLich}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(b.ngayDat, 'dd/MM/yyyy')}"></td>
                        <td class="fw-semibold text-nowrap" style="color: #ff4d6d;" th:text="${#temporals.format(b.gioDat, 'HH:mm')}"></td>
                        <td class="text-nowrap" th:text="${b.tenKhachHang}"></td>
                        <td class="text-nowrap" th:text="${b.soDienThoai}"></td>
                        <td th:text="${b.ghiChu}"></td>
                        <td class="text-center text-nowrap">
                            <span th:if="${b.trangThai == 'Chờ xác nhận'}" class="badge bg-warning text-dark px-3 py-2 rounded-pill text-nowrap">
                                <i class="fas fa-spinner fa-spin me-1"></i> Chờ xác nhận
                            </span>
                            <span th:if="${b.trangThai == 'Đã xác nhận'}" class="badge bg-primary text-white px-3 py-2 rounded-pill text-nowrap">
                                <i class="fas fa-check me-1"></i> Đã xác nhận
                            </span>
                            <span th:if="${b.trangThai == 'Hoàn thành'}" class="badge bg-success px-3 py-2 rounded-pill text-nowrap">
                                <i class="fas fa-check-double me-1"></i> Hoàn thành
                            </span>
                            <span th:if="${b.trangThai == 'Đã hủy'}" class="badge bg-secondary px-3 py-2 rounded-pill text-nowrap">
                                <i class="fas fa-times me-1"></i> Đã hủy
                            </span>
                        </td>
                        <td class="pe-4 text-end text-nowrap">
                            <form th:if="${b.trangThai == 'Chờ xác nhận'}" th:action="@{'/DatLich/Huy/' + ${b.maDatLich}}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn hủy lịch hẹn này?');">
                                <button type="submit" class="btn btn-sm btn-danger text-nowrap" title="Hủy lịch hẹn">
                                    Hủy lịch
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="fas fa-calendar-times fs-1 d-block mb-3 opacity-50"></i>
                            Bạn chưa có lịch hẹn đặt dịch vụ nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
