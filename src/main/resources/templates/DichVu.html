<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<style>
    .service-banner {
        background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
        border-radius: 24px;
        padding: 40px 20px;
        margin-bottom: 40px;
    }
    .service-card {
        border: none;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        background: #ffffff;
    }
    .service-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(255, 107, 157, 0.15);
    }
    .service-img-wrapper {
        position: relative;
        height: 220px;
        overflow: hidden;
        background-color: #f8f9fa;
    }
    .service-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .service-card:hover .service-img {
        transform: scale(1.08);
    }
    .service-price {
        font-size: 1.3rem;
        font-weight: 700;
        color: #ff6b9d;
    }
    .btn-book-now {
        background: linear-gradient(135deg, #ff6b9d 0%, #f5576c 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 10px 24px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }
    .btn-book-now:hover {
        background: linear-gradient(135deg, #e5427d 0%, #db3659 100%);
        color: white;
        box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
    }
    .badge-service {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(5px);
        color: #ff6b9d;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 0.85rem;
    }
</style>

<main class="container mt-5">
    <!-- Notification Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-pill px-4 shadow-sm mb-4" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-pill px-4 shadow-sm mb-4" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="service-banner text-center shadow-sm">
        <h1 class="display-5 fw-bold text-dark mb-2">Dịch Vụ Thú Cưng</h1>
        <p class="text-muted fs-5 mb-0">Hệ thống chăm sóc, làm đẹp và dưỡng sinh chuẩn 5 sao dành cho báu vật của bạn</p>
    </div>

    <div class="row g-4 mb-5">
        <div th:each="dv : ${services}" class="col-xl-4 col-md-6 col-12">
            <div class="card service-card h-100">
                <div class="service-img-wrapper">
                    <img th:src="@{'/Content/HinhAnh/' + ${dv.hinhAnh != null ? dv.hinhAnh : 'default-service.jpg'}}"
                         class="service-img"
                         th:alt="${dv.tenDV}">
                    <span class="badge-service shadow-sm">Premium Care</span>
                </div>
                <div class="card-body d-flex flex-column p-4">
                    <h4 class="card-title fw-bold text-dark mb-2" th:text="${dv.tenDV}"></h4>
                    <p class="card-text text-muted flex-grow-1 mb-4"
                       th:text="${dv.moTa}"
                       style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                    </p>
                    <div class="d-flex align-items-center justify-content-between pt-3 border-top mt-auto">
                        <div>
                            <small class="text-uppercase text-muted d-block" style="font-size: 0.75rem; letter-spacing: 1px;">Giá dịch vụ</small>
                            <span class="service-price" th:text="${#numbers.formatDecimal(dv.giaDichVu, 0, 0, 'COMMA')} + ' đ'"></span>
                        </div>

                        <a th:href="@{/DatLich(maDV=${dv.maDV})}" class="btn btn-book-now px-4">
                            Đặt Lịch
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(services)}" class="col-12 text-center py-5">
            <div class="alert alert-warning d-inline-block px-5 py-3 rounded-pill">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Hiện tại hệ thống chưa cập nhật dịch vụ nào.
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
