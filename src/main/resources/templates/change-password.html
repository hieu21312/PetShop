<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <div class="text-center mb-4">
                            <div class="rounded-circle bg-pink-light d-inline-flex align-items-center justify-content-center mb-3"
                                 style="width: 70px; height: 70px; background-color: #ffeef2;">
                                <i class="fas fa-key text-pink fs-2" style="color: #e83e8c;"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Đổi mật khẩu</h3>
                            <p class="text-muted small">Cập nhật mật khẩu định kỳ để bảo vệ tài khoản của bạn</p>
                        </div>

                        <!-- Thông báo kết quả -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 small" role="alert">
                            <i class="fas fa-check-circle me-1"></i><span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 small" role="alert">
                            <i class="fas fa-exclamation-circle me-1"></i><span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/DoiMatKhau}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Mật khẩu hiện tại</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                    <input type="password" name="oldPassword" class="form-control bg-light border-start-0"
                                           placeholder="Nhập mật khẩu hiện tại" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-shield-alt text-muted"></i></span>
                                    <input type="password" name="newPassword" class="form-control bg-light border-start-0"
                                           placeholder="Tối thiểu 4 ký tự" required minlength="4">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                                    <input type="password" name="confirmPassword" class="form-control bg-light border-start-0"
                                           placeholder="Nhập lại mật khẩu mới" required minlength="4">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-pink w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                                <i class="fas fa-save me-1"></i> Lưu thay đổi
                            </button>

                            <div class="text-center">
                                <a th:href="@{/}" class="text-muted text-decoration-none small">
                                    <i class="fas fa-arrow-left me-1"></i> Quay về trang chủ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
