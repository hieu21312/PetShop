<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Đăng ký thành viên</div>
                    <div class="card-body">
                        <div th:if="${session.error}" class="alert alert-danger" th:text="${session.error}"></div>
                        <form th:action="@{/XuLyDangKy}" method="post">
                            <div class="mb-3">
                                <label>Họ tên</label>
                                <input type="text" name="tenKH" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Mật khẩu</label>
                                <input type="password" name="matKhau" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Nhập lại mật khẩu</label>
                                <input type="password" name="reMatKhau" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Điện thoại</label>
                                <input type="text" name="dienThoai" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label>Địa chỉ</label>
                                <input type="text" name="diaChi" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Đăng ký</button>
                        </form>
                        <p class="mt-3"><a th:href="@{/DangNhap}">Đã có tài khoản? Đăng nhập</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
