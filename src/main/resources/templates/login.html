<div th:replace="~{layout :: layout(content=~{::section})}">
    <section>
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Đăng nhập</div>
                    <div class="card-body">
                        <div th:if="${session.error}" class="alert alert-danger" th:text="${session.error}"></div>
                        <form th:action="@{/XuLyDN}" method="post">
                            <input type="hidden" name="url" th:value="${param.url}">
                            <div class="mb-3">
                                <label>Email / Mã nhân viên</label>
                                <input type="text" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Mật khẩu</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                        </form>
                        <p class="mt-3"><a th:href="@{/DangKy}">Đăng ký tài khoản</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
