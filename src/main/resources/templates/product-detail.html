<div th:replace="~{layout :: layout(content=~{::section})}">
  <section>
    <div class="row">
      <div class="col-md-5">
        <img th:src="@{'/Content/HinhAnh/' + ${product.anhDaiDien}}"
             class="main-product-image"
             id="mainImage">
        <div class="mt-2 d-flex flex-wrap">
          <img th:each="img : ${images}"
               th:src="@{'/Content/HinhAnh/' + ${img.hinhAnh}}"
               class="thumb-img"
               onclick="changeImage(this)">
        </div>
      </div>
      <div class="col-md-7">
        <h1 class="product-title"
            th:text="${product.tenSP}">
        </h1>
        <h2 class="product-price" th:text="${#numbers.formatDecimal(product.giaBan, 1, 'POINT', 0, 'COMMA')} + ' Đ'"></h2>

        <p th:text="${product.moTa}"></p>
        <div class="info-box">

          <div class="info-row">
            <span>Giới tính</span>
            <strong th:text="${product.gioiTinh ?: '---'}"></strong>
          </div>

          <div class="info-row">
            <span>Ngày sinh</span>
            <strong th:text="${product.ngaySinh} ? ${#temporals.format(product.ngaySinh, 'dd/MM/yyyy')} : '---'"></strong>
          </div>

          <div class="info-row">
            <span>Màu sắc</span>
            <strong th:text="${product.mauSac ?: '---'}"></strong>
          </div>

          <div class="info-row">
            <span>Sức khỏe</span>
            <strong th:text="${product.tinhTrangSucKhoe ?: '---'}"></strong>
          </div>

        </div>
        <div class="product-buttons">
          <a th:href="@{/ThemGioHang(iMaSP=${product.maSP})}" class="btn btn-success btn-lg">Thêm vào giỏ</a>
          <a th:href="@{/DatHang}" class="btn btn-outline-danger btn-lg">Mua ngay</a>
        </div>
      </div>
    </div>
    <div class="mt-5 pt-4 border-top">
      <h3 class="mb-4 fw-bold text-uppercase" style="color: #2c3e50;">
        <i class="fas fa-comments me-2" style="color: #e91e63;"></i> Đánh giá từ khách hàng
      </h3>

      <div class="row g-4">
        <div class="col-lg-4 col-md-5">
          <div class="card shadow-sm border-0 bg-light rounded-4 sticky-top" style="top: 20px; z-index: 1;">
            <div class="card-body p-4">
              <h5 class="card-title fw-bold mb-4" style="color: #e91e63;">Viết đánh giá của bạn</h5>
              <form th:action="@{/GuiBinhLuan}" method="post">
                <input type="hidden" name="maSP" th:value="${product.maSP}">

                <div class="mb-3">
                  <label class="form-label text-muted small fw-bold">Họ và tên</label>
                  <input type="text" name="hoTen" class="form-control rounded-3 py-2" placeholder="Nhập tên của bạn" required>
                </div>

                <div class="mb-3">
                  <label class="form-label text-muted small fw-bold">Mức độ hài lòng</label>
                  <select name="soSao" class="form-select rounded-3 py-2 text-warning fw-bold shadow-none border-warning">
                    <option value="5">★★★★★ (Tuyệt vời)</option>
                    <option value="4">★★★★☆ (Khá tốt)</option>
                    <option value="3">★★★☆☆ (Trung bình)</option>
                    <option value="2">★★☆☆☆ (Kém)</option>
                    <option value="1">★☆☆☆☆ (Tệ)</option>
                  </select>
                </div>

                <div class="mb-4">
                  <label class="form-label text-muted small fw-bold">Nội dung đánh giá</label>
                  <textarea name="noiDung" class="form-control rounded-3" rows="4" placeholder="Chia sẻ cảm nhận của bạn về bé thú cưng hoặc dịch vụ..." required></textarea>
                </div>

                <button type="submit" class="btn w-100 rounded-pill py-2 fw-bold text-white shadow-sm" style="background-color: #e91e63; border: none;">
                  <i class="fas fa-paper-plane me-1"></i> Gửi Đánh Giá
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8 col-md-7">
          <div class="d-flex flex-column gap-3">

            <div th:each="r : ${reviews}" class="card shadow-sm border-0 rounded-4 overflow-hidden">
              <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white shadow-sm"
                         style="width: 48px; height: 48px; background: linear-gradient(135deg, #e91e63, #ff8a80);">
                      <i class="fas fa-user"></i>
                    </div>
                    <div>
                      <h6 class="mb-0 fw-bold text-dark" th:text="${r.hoTen}">Tên Khách Hàng</h6>
                      <small class="text-muted" th:text="${#temporals.format(r.ngay, 'dd/MM/yyyy HH:mm')}">Thời gian</small>
                    </div>
                  </div>

                  <div class="text-warning fs-6 bg-warning bg-opacity-10 px-2 py-1 rounded-pill">
                    <span th:each="i,stat : ${#numbers.sequence(1,5)}">
                      <i th:class="${stat.count <= r.soSao} ? 'fas fa-star' : 'far fa-star'"></i>
                    </span>
                  </div>
                </div>

                <div class="mt-3 p-3 bg-light rounded-3">
                  <p class="mb-0 text-dark" style="line-height: 1.6; font-size: 0.95rem;" th:text="${r.noiDung}">
                    Nội dung đánh giá của khách hàng sẽ hiển thị ở đây.
                  </p>
                </div>
              </div>
            </div>

            <div th:if="${#lists.isEmpty(reviews)}" class="text-center p-5 rounded-4" style="background-color: #f8f9fa; border: 2px dashed #dee2e6;">
              <i class="far fa-comment-dots fa-4x mb-3" style="color: #ced4da;"></i>
              <h5 class="text-secondary fw-bold">Chưa có đánh giá nào</h5>
              <p class="text-muted mb-0">Hãy là người đầu tiên để lại nhận xét về sản phẩm này nhé!</p>
            </div>

          </div>
        </div>
      </div>
    </div>

    <div th:if="${not #lists.isEmpty(relatedProducts)}" class="mt-5">
      <h3 class="mb-4 fw-bold">Thú cưng liên quan</h3>

      <div class="row g-4">

        <div th:each="p : ${relatedProducts}" class="col-lg-3 col-md-4 col-6">

          <div class="card custom-product-card border-0 shadow-sm">

            <a th:href="@{/ChiTiet(masp=${p.maSP})}" class="text-decoration-none">

              <div class="product-img-wrapper detail-img-height">
                <img th:src="@{'/Content/HinhAnh/' + ${p.anhDaiDien}}"
                     class="card-img-top">
              </div>

              <div class="card-body d-flex flex-column">

                <h6 class="product-title-clamp"
                    th:text="${p.tenSP}">
                </h6>

                <p class="text-danger fw-bold fs-5 mt-auto"
                   th:text="${#numbers.formatDecimal(p.giaBan, 1, 'POINT', 0, 'COMMA')} + ' Đ'">
                </p>

              </div>

            </a>

          </div>

        </div>

      </div>
    </div>
  </section>
</div>

<script>
  function changeImage(img) {
    document.getElementById('mainImage').src = img.src;
    document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
    img.classList.add('active');
  }
</script>
